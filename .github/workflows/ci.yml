name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ── Type Check + Lint ──────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test

      - name: TypeScript check — API
        run: cd apps/api && npx tsc --noEmit

      - name: TypeScript check — Web
        run: cd apps/web && npx tsc --noEmit

  # ── Unit Tests ─────────────────────────────────────────────
  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test

      - name: Run unit tests
        run: cd apps/api && npx jest --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test
          JWT_SECRET: ci-test-secret-at-least-16-chars
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SENTRY_DSN: ''

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  # ── Build Check ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test

      - name: Build API
        run: cd apps/api && npx nest build

      - name: Build Web
        run: cd apps/web && npx next build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test
          JWT_SECRET: ci-build-secret-at-least-16-chars
          NEXT_PUBLIC_SENTRY_DSN: ''
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── API Integration Tests (supertest) ─────────────────────
  test-api-e2e:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackfluence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test

      - name: Push schema to test DB
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test

      - name: Run integration tests
        run: cd apps/api && npx jest --config test/jest-e2e.json --forceExit --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_test
          JWT_SECRET: ci-e2e-secret-at-least-16-chars
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  # ── Playwright E2E Tests ───────────────────────────────────
  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackfluence_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackfluence_e2e
      JWT_SECRET: ci-playwright-secret-at-least-16-chars
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      APP_BASE_URL: http://localhost:3000
      PORT: 4000
      NODE_ENV: production
      SENTRY_DSN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema to E2E DB
        run: pnpm db:push

      - name: Build API
        run: cd apps/api && npx nest build

      - name: Build Web
        run: cd apps/web && npx next build

      - name: Start API
        run: cd apps/api && node dist/main &

      - name: Start Web
        run: cd apps/web && npx next start -p 3000 &

      - name: Wait for services
        run: |
          npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: cd apps/web && npx playwright test --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
